[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-fxmacrodata"
version = "1.0.0"
description = "CLI-Anything harness for FXMacroData: official macroeconomic releases, release calendars and FX rates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "FXMacroData", email = "info@fxmacrodata.com" }]
dependencies = ["click>=8.0.0", "prompt-toolkit>=3.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
cli-anything-fxmacrodata = "cli_anything.fxmacrodata.fxmacrodata_cli:main"

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=referral&utm_campaign=cli-anything-fxmacrodata&utm_content=homepage"
Documentation = "https://fxmacrodata.com/documentation/reference?utm_source=pypi&utm_medium=referral&utm_campaign=cli-anything-fxmacrodata&utm_content=docs"
Source = "https://github.com/fxmacrodata/cli-anything-fxmacrodata"

[tool.setuptools.packages.find]
include = ["cli_anything.*"]
namespaces = true

[tool.setuptools.package-data]
"cli_anything.fxmacrodata" = ["skills/*.md", "README.md"]
